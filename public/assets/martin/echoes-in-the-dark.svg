<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0c071e"/>
      <stop offset="45%" stop-color="#050814"/>
      <stop offset="100%" stop-color="#020307"/>
    </radialGradient>
    <radialGradient id="flowerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff007f" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#ffea00"/>
      <stop offset="80%" stop-color="#ff9100"/>
      <stop offset="100%" stop-color="#ff9100" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scanBeam" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#00a8ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gridFade" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Abyssal Background -->
  <rect width="600" height="600" fill="url(#bgGrad)"/>

  <!-- 3D Perspective Grid Subterranean Floor -->
  <g opacity="0.75">
    <!-- Horizontal depth lines -->
    <line x1="0" y1="580" x2="600" y2="580" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.6"/>
    <line x1="40" y1="530" x2="560" y2="530" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.45"/>
    <line x1="90" y1="490" x2="510" y2="490" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.35"/>
    <line x1="140" y1="460" x2="460" y2="460" stroke="#8b5cf6" stroke-width="0.9" stroke-opacity="0.25"/>
    <line x1="180" y1="438" x2="420" y2="438" stroke="#8b5cf6" stroke-width="0.8" stroke-opacity="0.2"/>
    <line x1="220" y1="422" x2="380" y2="422" stroke="#8b5cf6" stroke-width="0.7" stroke-opacity="0.15"/>
    <line x1="250" y1="410" x2="350" y2="410" stroke="#8b5cf6" stroke-width="0.6" stroke-opacity="0.1"/>

    <!-- Perspective convergence lines to vanishing point (300, 395) -->
    <line x1="0" y1="600" x2="300" y2="395" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.5"/>
    <line x1="100" y1="600" x2="300" y2="395" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.4"/>
    <line x1="200" y1="600" x2="300" y2="395" stroke="#00f0ff" stroke-width="0.9" stroke-opacity="0.3"/>
    <line x1="300" y1="600" x2="300" y2="395" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.3"/>
    <line x1="400" y1="600" x2="300" y2="395" stroke="#00f0ff" stroke-width="0.9" stroke-opacity="0.3"/>
    <line x1="500" y1="600" x2="300" y2="395" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.4"/>
    <line x1="600" y1="600" x2="300" y2="395" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.5"/>
  </g>

  <!-- Subterranean Architecture Monolith Outlines (LiDAR Scanned Pillars) -->
  <g stroke="#00f0ff" stroke-width="1.2" fill="none" opacity="0.35" stroke-dasharray="2,3">
    <!-- Left Monolith -->
    <polygon points="50,220 130,240 130,470 50,450"/>
    <line x1="130" y1="240" x2="160" y2="230"/>
    <line x1="130" y1="470" x2="160" y2="455"/>
    <!-- Right Monolith -->
    <polygon points="550,210 470,235 470,475 550,445"/>
    <line x1="470" y1="235" x2="440" y2="225"/>
    <line x1="470" y1="475" x2="440" y2="458"/>
  </g>

  <!-- Raycasted LiDAR Point Cloud Particles (Scatter in 3D Space) -->
  <g fill="#00f0ff">
    <!-- Dense scan points along walls -->
    <circle cx="52" cy="235" r="1.5" opacity="0.8"/>
    <circle cx="65" cy="270" r="1.2" opacity="0.7"/>
    <circle cx="78" cy="310" r="1.5" opacity="0.9"/>
    <circle cx="95" cy="350" r="1.2" opacity="0.75"/>
    <circle cx="112" cy="390" r="1.6" opacity="0.9"/>
    <circle cx="125" cy="430" r="1.2" opacity="0.6"/>
    <circle cx="80" cy="445" r="1.8" opacity="0.8"/>
    <circle cx="140" cy="260" r="1.2" opacity="0.5"/>
    <circle cx="150" cy="320" r="1.4" opacity="0.65"/>
    <circle cx="155" cy="400" r="1.3" opacity="0.7"/>

    <circle cx="545" cy="230" r="1.5" opacity="0.8"/>
    <circle cx="530" cy="265" r="1.2" opacity="0.7"/>
    <circle cx="510" cy="310" r="1.6" opacity="0.85"/>
    <circle cx="490" cy="355" r="1.3" opacity="0.7"/>
    <circle cx="480" cy="405" r="1.5" opacity="0.9"/>
    <circle cx="465" cy="450" r="1.2" opacity="0.6"/>
    <circle cx="445" cy="250" r="1.4" opacity="0.5"/>
    <circle cx="435" cy="340" r="1.3" opacity="0.6"/>

    <!-- Ceiling / Arch scan points -->
    <circle cx="180" cy="150" r="1.2" opacity="0.5"/>
    <circle cx="230" cy="120" r="1.4" opacity="0.6"/>
    <circle cx="300" cy="100" r="1.8" opacity="0.7" fill="#ffffff"/>
    <circle cx="370" cy="120" r="1.4" opacity="0.6"/>
    <circle cx="420" cy="150" r="1.2" opacity="0.5"/>
  </g>

  <!-- Distant Mate Silhouette & Ethereal Horizon Beacon -->
  <g filter="url(#glow)">
    <circle cx="300" cy="385" r="28" fill="#ffffff" opacity="0.15"/>
    <circle cx="300" cy="385" r="14" fill="#a855f7" opacity="0.3"/>
    <circle cx="300" cy="385" r="5" fill="#ffffff" opacity="0.9"/>
    <!-- Resonant Aura rings -->
    <ellipse cx="300" cy="385" rx="45" ry="12" fill="none" stroke="#a855f7" stroke-width="0.8" opacity="0.6"/>
    <ellipse cx="300" cy="385" rx="75" ry="18" fill="none" stroke="#00f0ff" stroke-width="0.7" opacity="0.4"/>
  </g>

  <!-- Focused Photonic Scanning Laser Beam (originating from POV center-bottom) -->
  <polygon points="300,590 240,430 360,430" fill="url(#scanBeam)"/>
  <line x1="300" y1="590" x2="300" y2="430" stroke="#00f0ff" stroke-width="2" filter="url(#glow)"/>

  <!-- Resonant Flower Beacon (Center Foreground) -->
  <g transform="translate(300, 420)">
    <!-- Base Beacon Pedestal (Black obsidian plinth with glowing seam) -->
    <polygon points="-30,60 30,60 22,78 -22,78" fill="#090d18" stroke="#ffb703" stroke-width="1.2"/>
    <line x1="-22" y1="78" x2="22" y2="78" stroke="#ffea00" stroke-width="2" filter="url(#glow)"/>

    <!-- Stem -->
    <path d="M0,60 Q-4,25 0,-10" fill="none" stroke="#10b981" stroke-width="3"/>
    <path d="M0,60 Q-4,25 0,-10" fill="none" stroke="#6ee7b7" stroke-width="1" filter="url(#glow)"/>

    <!-- Radiant Bloom Glow -->
    <circle cx="0" cy="-10" r="85" fill="url(#flowerGlow)"/>

    <!-- Blooming Petals (Geometric Resonant Blossom) -->
    <!-- Outer Petals (Magenta) -->
    <path d="M0,-10 C-30,-45 -40,-60 0,-75 C40,-60 30,-45 0,-10" fill="#ff007f" opacity="0.85" filter="url(#glow)"/>
    <path d="M0,-10 C-45,-30 -60,-40 -75,0 C-60,40 -45,30 0,-10" fill="#ff007f" opacity="0.85" filter="url(#glow)"/>
    <path d="M0,-10 C45,-30 60,-40 75,0 C60,40 45,30 0,-10" fill="#ff007f" opacity="0.85" filter="url(#glow)"/>
    <path d="M0,-10 C-25,-35 -50,-50 -45,-70 C-20,-60 -15,-40 0,-10" fill="#e11d48" opacity="0.9"/>
    <path d="M0,-10 C25,-35 50,-50 45,-70 C20,-60 15,-40 0,-10" fill="#e11d48" opacity="0.9"/>

    <!-- Inner Petals (Violet & Pink) -->
    <path d="M0,-10 C-18,-25 -25,-40 0,-50 C25,-40 18,-25 0,-10" fill="#c026d3" opacity="0.95"/>
    <path d="M0,-10 C-30,-15 -40,-20 -48,0 C-38,20 -28,15 0,-10" fill="#c026d3" opacity="0.95"/>
    <path d="M0,-10 C30,-15 40,-20 48,0 C38,20 28,15 0,-10" fill="#c026d3" opacity="0.95"/>

    <!-- Radiant Golden Energy Core -->
    <circle cx="0" cy="-10" r="18" fill="url(#goldCore)" filter="url(#glow)"/>
    <circle cx="0" cy="-10" r="7" fill="#ffffff" filter="url(#glow)"/>

    <!-- Resonant Acoustic Wave Rings (Summoning the mate) -->
    <circle cx="0" cy="-10" r="45" fill="none" stroke="#ff007f" stroke-width="1.2" opacity="0.75" stroke-dasharray="4,6"/>
    <circle cx="0" cy="-10" r="70" fill="none" stroke="#ffea00" stroke-width="0.8" opacity="0.5" stroke-dasharray="3,8"/>
    <circle cx="0" cy="-10" r="105" fill="none" stroke="#00f0ff" stroke-width="0.6" opacity="0.3" stroke-dasharray="2,10"/>
  </g>

  <!-- Incoming Viral Spores (Corner Threat Particles) -->
  <g filter="url(#glow)">
    <!-- Spore 1 (Top Left) -->
    <circle cx="160" cy="200" r="5" fill="#ef4444"/>
    <line x1="160" y1="190" x2="160" y2="210" stroke="#f87171" stroke-width="1.2"/>
    <line x1="150" y1="200" x2="170" y2="200" stroke="#f87171" stroke-width="1.2"/>
    <!-- Spore 2 (Mid Right) -->
    <circle cx="440" cy="260" r="6" fill="#f97316"/>
    <line x1="440" y1="248" x2="440" y2="272" stroke="#fb923c" stroke-width="1.2"/>
    <line x1="428" y1="260" x2="452" y2="260" stroke="#fb923c" stroke-width="1.2"/>
    <!-- Spore 3 (Top Right) -->
    <circle cx="410" cy="180" r="4" fill="#ef4444"/>
    <line x1="410" y1="172" x2="410" y2="188" stroke="#f87171" stroke-width="1"/>
    <line x1="402" y1="180" x2="418" y2="180" stroke="#f87171" stroke-width="1"/>
  </g>

  <!-- High-Tech HUD Telemetry Overlays -->
  <!-- Top Bar -->
  <g font-family="monospace" text-anchor="middle" font-weight="bold">
    <!-- Sector Tag -->
    <rect x="180" y="24" width="240" height="22" fill="#000000" stroke="#00f0ff" stroke-width="1.2"/>
    <text x="300" y="39" fill="#00f0ff" font-size="10" letter-spacing="3">SECTOR 01: UNIFIED SUB-ABYSS</text>
  </g>

  <!-- Top Left Target Reticle -->
  <g stroke="#00f0ff" stroke-width="1" fill="none" opacity="0.8">
    <circle cx="45" cy="45" r="16"/>
    <line x1="45" y1="24" x2="45" y2="66"/>
    <line x1="24" y1="45" x2="66" y2="45"/>
    <circle cx="45" cy="45" r="4" fill="#00f0ff"/>
    <text x="70" y="42" font-family="monospace" font-size="8" fill="#00f0ff" font-weight="bold" stroke="none">LIDAR: ACTIVE</text>
    <text x="70" y="52" font-family="monospace" font-size="7" fill="#8b5cf6" font-weight="bold" stroke="none">220K PTS</text>
  </g>

  <!-- Top Right Resonant Gauge -->
  <g font-family="monospace" text-anchor="end" font-size="8" fill="#ff007f" font-weight="bold">
    <text x="560" y="42">LURE HARMONIC</text>
    <rect x="460" y="48" width="100" height="6" fill="#180020" stroke="#ff007f" stroke-width="0.8"/>
    <rect x="462" y="50" width="75" height="2" fill="#ff007f" filter="url(#glow)"/>
    <text x="560" y="66" fill="#ffea00" font-size="7">75% LOCKED</text>
  </g>

  <!-- Center Title Banner (Sci-Fi Typography) -->
  <g font-family="monospace" text-anchor="middle">
    <!-- Main Title Shadow -->
    <text x="302" y="542" font-size="24" font-weight="900" fill="#000000" letter-spacing="4">ECHOES IN THE DARK</text>
    <!-- Main Title Foreground -->
    <text x="300" y="540" font-size="24" font-weight="900" fill="#ffffff" letter-spacing="4" filter="url(#glow)">ECHOES IN THE DARK</text>
    <!-- Subtitle -->
    <text x="300" y="560" font-size="10" font-weight="bold" fill="#00f0ff" letter-spacing="2">3D PHOTONIC LIDAR &amp; FLORAL RESONANCE</text>
    <!-- Author Credit -->
    <text x="300" y="576" font-size="8" fill="#a855f7" letter-spacing="1">MAXIME • MARTIN • AISAH • MANA</text>
  </g>

  <!-- Corner Border Brackets (Arcade CRT Framing) -->
  <g stroke="#ffffff" stroke-width="2" fill="none" opacity="0.8">
    <polyline points="10,35 10,10 35,10"/>
    <polyline points="590,35 590,10 565,10"/>
    <polyline points="10,565 10,590 35,590"/>
    <polyline points="590,565 590,590 565,590"/>
  </g>
</svg>
